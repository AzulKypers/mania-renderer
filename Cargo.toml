[package]
name = "mania-renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
fontdue = "0.9"
lzma-rs = "0.3"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "glow", "x11", "wayland"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2"
tar = "0.4"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
wgpu = { version = "22", default-features = false, features = ["dx12", "wgsl"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = 0
strip = true

[profile.dev]
opt-level = 2
